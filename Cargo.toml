[workspace]
members = ["protocol_codegen"]

[package]
name = "kafka-protocol"
version = "0.7.0"
authors = [
    "Diggory Blake <diggsey@googlemail.com>",
    "Jem McElwain <jmcelwain@gmail.com>",
    "belltoy <belltoy@gmail.com>",
    "Enzo Lombardi <enzinol@gmail.com>",
]
edition = "2018"
license = "MIT/Apache-2.0"
description = "Implementation of Kafka wire protocol."
homepage = "https://github.com/aovestdipaperino/proto-kafka"
repository = "https://github.com/aovestdipaperino/proto-kafka"
documentation = "https://docs.rs/kafka-protocol"
readme = "README.md"
keywords = ["kafka"]


[dependencies]
bytes = "1.0.1"
uuid = "1.3.0"
log = "0.4.14"
indexmap = "2.0.0"
crc = "3.0.0"
snap = "1.0.5"
flate2 = "1.0.20"
string = "0.3.0"
derive_builder = "0.12.0"
paste = "1.0.7"
crc32c = "0.6.4"

[lints.rust]
missing_debug_implementations = "warn"
redundant_imports = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
